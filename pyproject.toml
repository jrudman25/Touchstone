[project]
name = "touchstone-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

[tool.uv]
# Virtual workspace root: the root itself is not a package.
package = false

[tool.uv.workspace]
members = [
    "packages/evalcore",
    "services/api",
    "services/records",
    "services/worker",
]

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [
    "packages/evalcore/src",
    "services/api/src",
    "services/records/src",
    "services/worker/src",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*" = ["S101", "S404", "S603", "S607"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = [
    "packages/evalcore/src",
    "services/api/src",
    "services/records/src",
    "services/worker/src",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
