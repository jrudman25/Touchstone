[project]
name = "eval-worker"
version = "0.1.0"
description = "arq worker rendering prompts, calling providers, scoring, and writing run results."
requires-python = ">=3.13,<3.14"
dependencies = ["evalcore"]

[tool.uv.sources]
evalcore = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_worker"]
