name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: touchstone_test
  POSTGRES_USER: touchstone_test
  POSTGRES_PASSWORD: touchstone_test
  MONGO_URL: mongodb://localhost:27017
  MONGO_DB: touchstone_test
  REDIS_URL: redis://localhost:6379/0

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: touchstone_test
          POSTGRES_USER: touchstone_test
          POSTGRES_PASSWORD: touchstone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U touchstone_test -d touchstone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        # Keep in sync with docker-compose.yml. MongoDB 8.x refuses to start or
        # crashes on Linux kernels 6.19+ (SERVER-121912, SERVER-136848); 7.0 is unaffected.
        image: mongo:7.0.43
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.4
      - name: Sync workspace
        run: uv sync --all-packages --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: pytest
        run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: oxlint
        run: npm run lint
      - name: ESLint (Vue template rules)
        run: npm run lint:vue
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test

  api-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.4
      - name: Sync workspace
        run: uv sync --all-packages --locked
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Regenerate API types
        run: npm run generate:api
        working-directory: web
      - name: Check generated types are committed and clean
        run: |
          git diff --exit-code -- web/src/api/generated
          test -z "$(git status --porcelain -- web/src/api/generated)"
