name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: touchstone_test
  POSTGRES_USER: touchstone_test
  POSTGRES_PASSWORD: touchstone_test
  MONGO_URL: mongodb://localhost:27017
  MONGO_DB: touchstone_test
  REDIS_URL: redis://localhost:6379/0

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: touchstone_test
          POSTGRES_USER: touchstone_test
          POSTGRES_PASSWORD: touchstone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U touchstone_test -d touchstone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:8.0.32
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.4
      - name: Sync workspace
        run: uv sync --all-packages --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: pytest
        run: uv run pytest

# TODO (Checkpoint C): add ESLint, vue-tsc, Vitest, and the committed
# OpenAPI-generated-type drift check once web/ exists.
