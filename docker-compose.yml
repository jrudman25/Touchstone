name: touchstone

# Development Compose runs only the data stores. Django, FastAPI, and the
# worker run natively with uv; the app services and Caddy proxy live behind
# the "app" profile and are added in a later checkpoint.
#
# Store ports are bound to 127.0.0.1 only: placeholder dev credentials must
# never be reachable from the LAN.

services:
  postgres:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set (see .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  mongo:
    # Keep in sync with CI. MongoDB 8.x refuses to start or crashes on Linux
    # kernels 6.19+ (SERVER-121912, SERVER-136848); 7.0 is unaffected.
    image: mongo:7.0.43
    restart: unless-stopped
    # Cap WiredTiger cache; by default it claims ~half the memory it can see.
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7.4.10
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  mongo_data:
  redis_data:
